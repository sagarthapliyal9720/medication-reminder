{% extends "base.html" %}

{% block title %}Add Family Member · MediRemind{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto">
    <!-- Header -->
    <div class="mb-8">
        <a href="{% url 'family_members' %}" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-primary-600 mb-3 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Back to Family Members
        </a>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-800">Add Family Member</h1>
        <p class="text-slate-500 mt-1">Add someone to receive medication reminders.</p>
    </div>

    <!-- Form Card -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5">Name</label>
                <input type="text" name="name" required
                       placeholder="e.g. John Doe"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition text-slate-800 placeholder:text-slate-400">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
                <input type="email" name="email" required
                       placeholder="e.g. john@example.com"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition text-slate-800 placeholder:text-slate-400">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5">Phone</label>
                <input type="text" name="phone" required
                       placeholder="e.g. +91 98765 43210"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition text-slate-800 placeholder:text-slate-400">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5">Relation</label>
                <input type="text" name="relation" required
                       placeholder="Father, Mother, Brother, Spouse..."
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition text-slate-800 placeholder:text-slate-400">
            </div>

            <button type="submit"
                    class="w-full py-3 px-4 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-xl shadow-sm hover:shadow transition focus:outline-none focus:ring-2 focus:ring-primary-400 focus:ring-offset-2">
                Add Family Member
            </button>
        </form>
    </div>
</div>

{% endblock %}
