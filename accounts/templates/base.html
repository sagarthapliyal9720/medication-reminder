<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Medication Reminder{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        accent: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <a href="{% url 'dashboard' %}" class="flex items-center gap-2 group">
                    <div class="w-9 h-9 rounded-xl bg-primary-600 flex items-center justify-center shadow-md group-hover:bg-primary-700 transition">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
                        </svg>
                    </div>
                    <span class="font-semibold text-lg text-slate-800 tracking-tight">MediRemind</span>
                </a>

                <!-- Nav Links -->
                <div class="flex items-center gap-1 sm:gap-3">
                    {% if request.user.is_authenticated %}
                        <a href="{% url 'dashboard' %}"
                           class="px-3 py-2 text-sm font-medium text-slate-600 hover:text-primary-600 hover:bg-primary-50 rounded-lg transition">
                            Dashboard
                        </a>
                        <a href="{% url 'my_medicines' %}"
                           class="px-3 py-2 text-sm font-medium text-slate-600 hover:text-primary-600 hover:bg-primary-50 rounded-lg transition hidden sm:inline-block">
                            Medicines
                        </a>
                        <a href="{% url 'todays_doses' %}"
                           class="px-3 py-2 text-sm font-medium text-slate-600 hover:text-primary-600 hover:bg-primary-50 rounded-lg transition hidden sm:inline-block">
                            Today's Doses
                        </a>
                        <a href="{% url 'family_members' %}"
                           class="px-3 py-2 text-sm font-medium text-slate-600 hover:text-primary-600 hover:bg-primary-50 rounded-lg transition hidden sm:inline-block">
                            Family
                        </a>

                        <form method="POST" action="{% url 'logout' %}" class="ml-2">
                            {% csrf_token %}
                            <button type="submit"
                                    class="px-3 py-2 text-sm font-medium text-red-600 hover:bg-red-50 rounded-lg transition">
                                Logout
                            </button>
                        </form>
                    {% else %}
                        <a href="{% url 'login' %}"
                           class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-primary-600 rounded-lg transition">
                            Login
                        </a>
                        <a href="{% url 'register' %}"
                           class="px-4 py-2 text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 rounded-lg shadow-sm transition">
                            Register
                        </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 mt-12 py-6 text-center text-sm text-slate-500">
        <p>MediRemind &mdash; Never miss a dose again</p>
    </footer>

</body>
</html>
